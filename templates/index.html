<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal | Secure AWS Cloud</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            padding: 28px 24px;
            text-align: center;
            color: #ffffff;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .header p {
            margin-top: 6px;
            font-size: 0.875rem;
            color: #e0e7ff;
        }

        .badge {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        form {
            padding: 28px 24px;
        }

        .alert-success {
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.925rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #ffffff;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .file-upload-box {
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            background-color: #f8fafc;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .file-upload-box:hover {
            border-color: var(--primary);
            background-color: #eef2ff;
        }

        .file-upload-box input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 1.75rem;
            margin-bottom: 6px;
            display: block;
        }

        .upload-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
        }

        .upload-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .selected-file-name {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #059669;
            font-weight: 600;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }

        .footer {
            text-align: center;
            padding: 0 24px 20px 24px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Student Registration</h1>
            <p>AWS Cloud-Powered Portal</p>
            <span class="badge">EC2 &bull; RDS &bull; S3 Architecture</span>
        </div>

        <form action="/register" method="POST" enctype="multipart/form-data">
            {% if message %}
                <div class="alert-success">{{ message }}</div>
            {% endif %}

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="e.g. john@example.com" required>
            </div>

            <div class="form-group">
                <label for="course">Course Name</label>
                <input type="text" id="course" name="course" placeholder="e.g. Cloud Computing & DevOps" required>
            </div>

            <div class="form-group">
                <label>Profile Photograph</label>
                <label for="photo" class="file-upload-box">
                    <span class="upload-icon">&#128247;</span>
                    <span class="upload-text">Click to choose a photo</span>
                    <p class="upload-hint">PNG, JPG, or JPEG (Max 5MB)</p>
                    <div id="file-name" class="selected-file-name"></div>
                    <input type="file" id="photo" name="photo" accept="image/*" required onchange="showFileName(this)">
                </label>
            </div>

            <button type="submit">Submit Registration</button>
        </form>

        <div class="footer">
            Securely encrypted &bull; Zero hardcoded secrets &bull; IAM authenticated
        </div>
    </div>

    <script>
        function showFileName(input) {
            const fileNameDisplay = document.getElementById('file-name');
            if (input.files && input.files[0]) {
                fileNameDisplay.textContent = "Selected: " + input.files[0].name;
            } else {
                fileNameDisplay.textContent = "";
            }
        }
    </script>
</body>
</html>
